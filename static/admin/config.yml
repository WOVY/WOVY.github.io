backend:
  name: github
  repo: WOVY/WOVY.github.io
  branch: main
  base_url: https://oauth-proxy-jx1s.onrender.com
  auth_endpoint: auth

media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: toml-frontmatter
    filter: { field: post_template, value: [null, post] }
    fields:
      - &post_title { label: "제목", name: "title", widget: "string" }
      - &post_date { label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss.SSSZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "초안", name: "draft", widget: "boolean", default: false }
      - &post_summary { label: "요약", name: "summary", widget: "string", required: false }
      - { label: "태그", name: "tags", widget: "list", required: false, default: [] }
      - &post_series { label: "시리즈", name: "series", widget: "list", required: false, default: [] }
      - &post_cover
        label: "커버 이미지"
        name: "cover"
        widget: "object"
        required: false
        fields:
          - { label: "이미지", name: "image", widget: "image", required: false }
          - { label: "설명", name: "alt", widget: "string", required: false }
      - { name: "post_template", widget: "hidden", default: "post" }
      - { label: "본문", name: "body", widget: "markdown" }


  - name: htb_writeups
    label: "HTB 풀이"
    label_singular: "HTB 풀이"
    folder: content/posts
    create: true
    slug: "htb-{{htb.machine}}"
    extension: md
    format: toml-frontmatter
    filter: { field: post_template, value: htb }
    media_folder: /static/images/htb
    public_folder: /images/htb
    summary: "{{title}} · {{htb.difficulty}} {{draft | ternary('(초안)', '')}}"
    fields:
      - { label: "제목", name: "title", widget: "string", default: "[HTB] ", hint: "[HTB] 머신이름 형식. 예: [HTB] TwoMillion" }
      - *post_date
      - { label: "초안", name: "draft", widget: "boolean", default: true, hint: "초안은 블로그에 표시되지 않지만, 저장소가 공개라서 저장한 원본은 GitHub에서 누구나 볼 수 있습니다. Active 머신 풀이는 CMS에 저장하지 말고 로컬에 적어 두세요." }
      - { label: "요약", name: "summary", widget: "string", hint: "시작점부터 최고 권한까지 한 줄. 블로그 글 목록, 글 상단 정보 상자, 풀이 목록 표에 모두 나옵니다. 예: 초대 코드 API → 관리자 권한 → 명령 주입 → 커널 취약점으로 root" }
      - { label: "태그", name: "tags", widget: "list", required: false, default: ["HTB"], hint: "기법·기술 위주로. 예: HTB, Linux, LFI, sudo, 비밀번호 재사용" }
      - *post_series
      - *post_cover
      - label: "머신 정보"
        name: htb
        widget: object
        collapsed: false
        fields:
          - { label: "머신 이름", name: "machine", widget: "string" }
          - { label: "머신 페이지", name: "url", widget: "string", required: false, hint: "예: https://app.hackthebox.com/machines/이름" }
          - { label: "운영체제", name: "os", widget: "select", options: ["Linux", "Windows", "FreeBSD", "OpenBSD", "기타"], default: "Linux" }
          - { label: "난이도", name: "difficulty", widget: "select", options: ["Easy", "Medium", "Hard", "Insane"], default: "Easy" }
          - { label: "소요 시간", name: "time", widget: "string", required: false, hint: "예: 6시간" }
      - { name: "post_template", widget: "hidden", default: "htb" }
      - label: "본문"
        name: body
        widget: markdown
        modes: [raw, rich_text]
        default: |
          ## 요약

          [2~3문장. 어디서 무엇을 찾아 들어갔고, 무엇 때문에 최고 권한까지 올라갔는지 적는다. 예: 파일 다운로드 기능의 경로 조작으로 웹 설정 파일을 읽어 DB 비밀번호를 얻었다. 같은 비밀번호가 SSH 계정에도 쓰이고 있어 초기 접근에 성공했고, sudo로 허용된 백업 스크립트의 와일드카드를 악용해 root 권한을 얻었다.]

          ## 발견한 취약점

          | ID | 취약점 | 위험도 | 위치 | 대응 요약 |
          | --- | --- | --- | --- | --- |
          | V-01 | [예: 경로 조작을 통한 임의 파일 읽기] | [High] | [예: `/download?file=`] | [예: 허용 목록 기반 파일 지정] |
          | V-02 | [예: 비밀번호 재사용] | [High] | [예: SSH 22/tcp] | [예: 계정별 고유 비밀번호, 키 인증] |
          | V-03 | [예: 과도한 sudo 권한] | [Critical] | [예: `/etc/sudoers`] | [예: 와일드카드 제거, 최소 권한] |

          <!-- 위험도: Critical / High / Medium / Low / Info. 판단 근거는 '취약점 상세'의 CVSS로 남긴다. -->

          ## 수행 과정

          <!-- 흐름 쓰는 법
          1. 문장마다 관찰 → 추론 → 행동을 잇는다. 명령마다 왜 실행했는지 한 문장을 붙인다.
          2. 지금 못 쓰는 단서는 '보류'로 적고, 나중에 쓸 때 다시 짚는다.
          3. 길을 낸 실패(막힘 → 원인 추정 → 다음 시도)는 본문에 남긴다.
          4. 셸을 얻거나 사용자가 바뀌면 id 출력과 '현재 위치'를 적는다.
          5. 소제목(####)은 무엇을 했는지로 짓는다. 소제목만 이어 읽어도 경로가 보여야 한다. -->

          ### 1. 정보 수집 (Reconnaissance)

          #### 포트 스캔

          ```shell
          nmap -sC -sV -p- --min-rate 5000 -oN nmap.txt 10.10.11.X
          ```

          ```text
          [스캔 결과 중 판단에 쓴 줄만 남긴다]
          ```

          | 포트 | 서비스 | 버전 | 메모 |
          | --- | --- | --- | --- |
          | [22/tcp] | [ssh] | [OpenSSH 8.9p1] | [자격 증명이 생기면 시도] |
          | [80/tcp] | [http] | [nginx 1.18.0] | [`app.htb`로 리다이렉트 → hosts 등록] |

          #### [서비스 이름. 예: HTTP]

          [무엇을 보고 → 무엇으로 추정했고 → 그래서 무엇을 했는지. 예: IP로 접속하면 `app.htb`로 리다이렉트되어 hosts에 등록했다. 메인 페이지의 다운로드 링크가 `?file=` 파라미터로 파일명을 그대로 받는 것을 보고 경로 조작을 의심했다.]

          여기까지 알아낸 것:

          - [예: 다운로드 기능이 파일명을 파라미터로 직접 받는다]
          - [예: 세션 쿠키로 보아 백엔드는 PHP다]
          - 보류: [예: SSH — 자격 증명이 생기면 시도]

          ### 2. 초기 침투 (Initial Access)

          #### [한 일. 예: 다운로드 기능의 경로 조작]

          [관찰 → 추론 → 행동 순서로 쓴다. 보낸 요청과 실행한 명령은 그대로 남긴다.]

          [막혔다가 우회했다면 시도를 표로 남긴다. 성공한 한 번만 있으면 운처럼 보인다.]

          | 시도 | 결과 | 알게 된 점 |
          | --- | --- | --- |
          | [`?file=../../../etc/passwd`] | [빈 응답] | [`../`를 걸러 내는 것으로 추정] |
          | [`?file=....//....//....//etc/passwd`] | [파일 내용 출력] | [`../`를 한 번만 제거하는 필터] |

          ```http
          GET /download?file=....//....//....//etc/passwd HTTP/1.1
          Host: app.htb
          ```

          ![화면에 보이는 내용](/images/htb/파일명.png)

          #### [한 일. 예: 설정 파일 속 비밀번호로 SSH 접속]

          [보류해 둔 단서를 쓰는 곳이면 짚는다. 예: 정보 수집에서 보류한 SSH에 설정 파일에서 찾은 DB 비밀번호를 넣어 봤다.]

          ```text
          $ id
          uid=1000(user) gid=1000(user) groups=1000(user)
          ```

          현재 위치: [호스트와 사용자. 예: 대상 호스트의 일반 사용자 user]

          > 핵심 판단: [이 단계를 푼 결정적인 생각 한 줄]

          ### 3. 수평 이동 (Lateral Movement)

          <!-- 다른 사용자로 넘어가는 단계가 없으면 이 절을 지운다. -->

          #### [한 일. 예: 홈 디렉터리의 백업 파일에서 다른 사용자 키 발견]

          [셸을 얻은 뒤 둘러본 것(설정 파일, 홈 디렉터리, 내부 포트, 프로세스) 중 무엇을 보고 다른 계정으로 넘어갔는지.]

          현재 위치: [호스트와 사용자]

          ### 4. 권한 상승 (Privilege Escalation)

          #### [한 일. 예: sudo 허용 스크립트의 와일드카드 악용]

          ```shell
          sudo -l
          ```

          [권한 상승 경로를 어떻게 찾았는지(수동 점검, linpeas 등), 왜 악용이 되는지, 무엇을 실행했는지.]

          ```text
          # id
          uid=0(root) gid=0(root) groups=0(root)
          ```

          현재 위치: [호스트와 최종 권한. 예: 대상 호스트의 root]

          ### 시도했지만 안 된 것

          <!-- 끝까지 길이 안 열린 시도만 적는다. 우회로 이어진 실패는 본문에 둔다. -->

          - [예: 로그인 폼 SQL 인젝션 — 응답 차이가 없고 sqlmap도 실패해서 접음]
          - [예: 커널 익스플로잇 — 이미 패치된 버전]

          ## 취약점 상세

          ### V-01. [취약점 이름]

          | 항목 | 내용 |
          | --- | --- |
          | 위험도 | [High] |
          | CVSS 3.1 | [7.5] `[CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N]` |
          | 분류 | [CWE-22 경로 조작] |
          | 위치 | [`http://app.htb/download?file=`] |
          | CVE | [해당하면 번호, 없으면 이 행을 지운다] |

          **원인** — [어떤 코드나 설정 때문에 생기는 문제인지. root를 딴 뒤 실제 소스·설정 파일을 열어 봤다면 문제 부분을 인용한다.]

          **재현 절차**

          1. [요청이나 명령]
          2. [확인할 응답]

          **영향** — [이 취약점 하나로 공격자가 할 수 있는 것. 예: 웹 서버 계정으로 읽을 수 있는 모든 파일 열람, 설정 파일 속 자격 증명 노출]

          **대응 방안**

          - 즉시 조치: [예: 파일명을 직접 받지 않고 허용 목록의 ID로만 지정]
          - 근본 조치: [예: 사용자 입력으로 경로를 조합하지 않도록 구조 변경, 웹 계정의 파일 읽기 권한 축소]
          - 조치 확인: [수정 후 같은 요청을 보냈을 때 나와야 하는 결과]

          **탐지** — [이 공격이 어느 로그에 어떤 흔적을 남기는지. 예: 웹 접근 로그에 `../`나 `%2e%2e`가 든 요청이 연달아 찍힘]

          <!-- 취약점이 여러 개면 V-01 블록을 복사해 V-02, V-03으로 쓴다. -->

          ## 배운 점

          ### 새로 알게 된 것

          - [개념을 내 말로 설명한다. 예: sudo 규칙의 인자에 와일드카드(*)가 있으면 옵션을 끼워 넣을 수 있다. tar처럼 명령 실행 옵션(`--checkpoint-action`)이 있는 프로그램이면 곧바로 root 실행이 된다.]

          ### 막혔던 지점

          - [어디서 얼마나 막혔고 무엇을 보고 풀었는지. 힌트나 다른 풀이를 봤다면 어느 부분이었는지도 적는다.]

          ### 다음 머신에서 바로 확인할 것

          - [예: 설정 파일에서 비밀번호를 찾으면 /etc/passwd의 모든 셸 계정에 대입해 본다]

          ## 참고 자료

          - [문서나 글 제목](URL) — [어디에 참고했는지]

          <!-- 게시 전: 대괄호 안내문을 모두 지우고, 플래그·비밀번호 해시는 가린다. -->
